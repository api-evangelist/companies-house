apis:
- name: Companies House Streaming API
  description: >
    The Companies House Streaming API delivers real-time changes to Companies House data via long-running
    HTTP connections. It streams updates across nine data categories including company information, filing
    history, insolvency, charges, officers, persons with significant control, disqualified officers, exemptions,
    and PSC statements. Each account is limited to two concurrent streaming connections and requires an
    API key for authentication.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer-specs.company-information.service.gov.uk/streaming-api/guides/overview
  baseURL: https://stream.companieshouse.gov.uk
  tags:
